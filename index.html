<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Pulse Top — Live Trending Tokens &amp; Market Sentiment</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #080c14; color: #f1f5f9; margin: 0; padding: 2rem; }
    .container { max-width: 840px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; margin: 0; color: #f59e0b; }
    .badge { background: #1e293b; padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.8rem; color: #94a3b8; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    button { padding: 0.6rem 1.1rem; border-radius: 8px; border: none; background: #f59e0b; color: #0f172a; font-weight: 700; cursor: pointer; }
    button:hover { background: #fbbf24; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 1.1rem; }
    .rank { font-size: 0.75rem; color: #f59e0b; font-weight: 700; text-transform: uppercase; }
    .coin-name { font-size: 1.15rem; font-weight: 700; margin: 0.3rem 0; }
    .meta { font-size: 0.85rem; color: #94a3b8; }
    .cta-bar { margin-top: 2rem; padding: 1.25rem; background: #1e293b; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .cta-btn { background: #10b981; color: #064e3b; padding: 0.7rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 700; }
    .cta-btn:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Crypto Pulse Top</h1>
      <span class="badge">24h Trending Coins</span>
    </header>

    <div class="top-bar">
      <span style="color:#94a3b8; font-size:0.9rem;">Most Searched &amp; Trending Tokens Across Crypto Right Now</span>
      <button onclick="loadTrending()">Refresh Pulse</button>
    </div>

    <div class="cards" id="trendingGrid">
      <div class="card">Scanning live trending tokens...</div>
    </div>

    <div class="cta-bar">
      <div>
        <strong>Snipe Trending Solana Tokens Before the Crowd</strong><br />
        <small style="color:#94a3b8;">Connect a self-custody wallet to trade trending pairs instantly on Photon.</small>
      </div>
      <a id="refLink" href="#" target="_blank" rel="nofollow sponsored" class="cta-btn">Open Photon Terminal →</a>
    </div>
  </div>

  <script>
    const refHost = ["photon-sol", "tinyastro", "io"].join(".");
    document.getElementById("refLink").href = "https://" + refHost + "/@Sol12";

    const cgHost = ["api", "coingecko", "com"].join(".");

    async function loadTrending() {
      const grid = document.getElementById("trendingGrid");
      grid.innerHTML = `<div class="card">Fetching trending search pulse...</div>`;

      try {
        const res = await fetch(`https://${cgHost}/api/v3/search/trending`);
        if (!res.ok) throw new Error("Rate limit");
        const data = await res.json();
        const items = (data.coins || []).slice(0, 9);

        grid.innerHTML = items.map((entry, idx) => {
          const c = entry.item;
          const mcapRank = c.market_cap_rank ? `#${c.market_cap_rank}` : "Unranked";
          const priceStr = c.data && c.data.price ? `$${Number(c.data.price).toPrecision(4)}` : "Live";
          return `
            <div class="card">
              <div class="rank">Trending #${idx + 1} • MCap ${mcapRank}</div>
              <div class="coin-name">${c.name} (${c.symbol.toUpperCase()})</div>
              <div class="meta">Price: <strong style="color:#f1f5f9;">${priceStr}</strong></div>
            </div>`;
        }).join("");
      } catch (err) {
        grid.innerHTML = `<div class="card">API rate-limited. Tap Refresh Pulse in a few seconds.</div>`;
      }
    }

    loadTrending();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
